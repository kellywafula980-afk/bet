{% extends 'base.html' %}
{% block content %}
<h2>Verify Deposit</h2>
<p>We've sent a 4-digit OTP to your phone number ({{ request.user.phone_number }}).</p>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="otp" class="form-label">Enter OTP</label>
        <input type="text" name="otp" id="otp" maxlength="4" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Verify & Proceed</button>
</form>
<p><a href="{% url 'payments:deposit' %}">Cancel</a></p>
{% endblock %}
